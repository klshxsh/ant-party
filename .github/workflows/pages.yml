# Publishes the game to GitHub Pages on every push to main.
# Run the checks in tools/ locally before pushing (see CLAUDE.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Only the game itself goes on the site, not tools/, PLAN.md, etc.
      - name: Gather the site files
        run: |
          mkdir _site
          cp -R index.html style.css js audio _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
